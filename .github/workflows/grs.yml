name: README.md cards refresh

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=0d1116&icon_color=2ea44f&title_color=ffffff&text_color=c9d1d9&border_color=30363d
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate top-langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&hide=scss,less&layout=compact&langs_count=8&card_width=320&bg_color=0d1116&title_color=ffffff&text_color=c9d1d9&border_color=30363d
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "[~] README.md cards refresh" || exit 0
          git push
